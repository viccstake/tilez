[package]
name    = "seb-mul-game"
version = "0.1.0"
edition = "2024"

[lib]
name = "naval_game"

[features]
# The "render" feature pulls in Bevy for client-side rendering.
# It is NOT required to build or run either client or server.
render = []
# The "resolve" feature means that you produce your own next state. 
# It IS required by the server (for now).
resolve = []

[dependencies]
bevy  = { version = "0.18.0", optional = false }
clap  = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
futures = "0.3"
tracing = "0.1"
anyhow = "1"
tracing-subscriber = "0.3"

[[bin]]
name = "server"
required-features = ["resolve"]

[[bin]]
name = "client"
