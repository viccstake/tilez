[package]
name    = "seb-mul-game"
version = "0.1.0"
edition = "2024"

[lib]
name = "naval_game"

[features]
# The "game" feature pulls in Bevy for client-side rendering.
# It is NOT required to build or run the dedicated server.
#
#   Build server only:          cargo build --bin server
#   Build full game (+ Bevy):   cargo build --features game
game = ["dep:bevy"]

[dependencies]
bevy  = { version = "0.18.0", optional = true }
clap  = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
futures = "0.3"
tracing = "0.1"
anyhow = "1"
tracing-subscriber = "0.3"

[[bin]]
name = "server"

[[bin]]
name = "client"
required-features = ["game"]